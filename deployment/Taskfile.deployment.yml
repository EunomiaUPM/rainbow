# https://taskfile.dev
version: '3'

vars:
  SCRIPTS_DIR: scripts
  DEPLOYMENT_DIR: deployment

# ─────────────────────────────────────────────────────────────────────────────
# MINI — launch full Consumer/Provider stacks (db + redis + setup + service)
# Usage:
#   task mini:consumer
#   task mini:provider
# ─────────────────────────────────────────────────────────────────────────────
tasks:
  mini:consumer:
    desc: "Start Consumer mini stack (db + redis + setup + service)"
    cmds:
      - docker compose -f {{.DEPLOYMENT_DIR}}/docker-compose.mini.consumer.yaml up

  mini:provider:
    desc: "Start Provider mini stack (db + redis + setup + service)"
    cmds:
      - docker compose -f {{.DEPLOYMENT_DIR}}/docker-compose.mini.provider.yaml up

  # ─────────────────────────────────────────────────────────────────────────
  # DEV — launch infra only (db + redis) for local development
  # Usage:
  #   task dev:consumer
  #   task dev:provider
  # ─────────────────────────────────────────────────────────────────────────
  dev:consumer:
    desc: "Start Consumer dev infra (db + redis) for local development"
    dir: "{{.DEPLOYMENT_DIR}}/dev"
    cmds:
      - bash run-consumer-dev.sh

  dev:provider:
    desc: "Start Provider dev infra (db + redis) for local development"
    dir: "{{.DEPLOYMENT_DIR}}/dev"
    cmds:
      - bash run-provider-dev.sh

  # ─────────────────────────────────────────────────────────────────────────
  # DEV in TCK mode — same as dev:consumer / dev:provider, with DSP_TCK_MAPPING set so the
  # agents play their TCK scenarios and mount the TCK trigger (scripts/run-tck.sh --agents=local)
  # Usage:
  #   task deployment:dev:consumer:tck
  #   task deployment:dev:provider:tck
  # ─────────────────────────────────────────────────────────────────────────
  dev:consumer:tck:
    desc: "Start Consumer dev (db + redis + agent) in DSP TCK mode"
    dir: "{{.DEPLOYMENT_DIR}}/dev"
    env:
      DSP_TCK_MAPPING: "{{.ROOT_DIR}}/tck/tck_mapping.json"
    cmds:
      - bash run-consumer-dev.sh

  dev:provider:tck:
    desc: "Start Provider dev (db + redis + agent) in DSP TCK mode"
    dir: "{{.DEPLOYMENT_DIR}}/dev"
    env:
      DSP_TCK_MAPPING: "{{.ROOT_DIR}}/tck/tck_mapping.json"
    cmds:
      - bash run-provider-dev.sh

  dev:provider:ref:
    desc: "Start Provider dev infra (db + redis) for local development with transfer ref"
    dir: "{{.DEPLOYMENT_DIR}}/dev"
    cmds:
      - bash run-provider-dev-ref.sh
